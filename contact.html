    <h1>Get in touch</h1>
    <p>
        Have a question, comment, or just want to say hi? Fill out the form below and it'll come straight to my inbox.
    </p>

    <form class="contact-form" action="https://formspree.io/f/xeeywowz" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="_replyto" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send message</button>
    </form>

    <p>
        Prefer email directly? Reach me at
        <a target="_blank" href="mailto:dlcruz.tala@gmail.com">dlcruz.tala@gmail.com</a>.
    </p>
